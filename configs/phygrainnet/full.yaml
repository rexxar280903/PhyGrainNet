# D300 - candidate final: SSL encoder -> ETS supervised pretrain -> competition fine-tune.
experiment_id: D300
base: ../default.yaml
pipeline: cnn
cv:
  strategy: group_kfold
  n_folds: 5
training:
  init_checkpoint: /kaggle/working/outputs/P100/ets_pretrained.pt
  init_encoder_only: false
  learning_rate: 0.0003
  epochs: 30
  full_fit: true
notes_short: SSL(P000) -> ETS(P100) -> fine-tune
