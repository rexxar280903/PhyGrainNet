# P000 - SimCLR pretraining of the GrainEncoder from random init on soil photos only.
experiment_id: P000
base: ../default.yaml
pipeline: ssl
ssl:
  epochs: 60
  steps_per_epoch: 100
  batch_size: 128
  tile_px: 192
  learning_rate: 0.001
  temperature: 0.2
  use_competition_photos: true
  include_test_photos: true     # DEC-010: unlabelled test photos allowed for SSL (no labels, no hand labelling)
  use_ets: false                # switch on once the ETS Kaggle dataset exists
external:
  ets_catalog: /kaggle/input/ets-photogranulometry-10ppm/ets_catalog.csv
  ets_labels: /kaggle/input/ets-photogranulometry-10ppm/ets_labels_11pt.csv
